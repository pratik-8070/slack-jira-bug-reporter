display_information:
  name: Bug Reporter
  description: File Jira bugs from Slack with /report
  background_color: "#1d1c1d"

features:
  bot_user:
    display_name: Bug Reporter
    always_online: true
  slash_commands:
    - command: /report
      description: Report a bug
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write

settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
